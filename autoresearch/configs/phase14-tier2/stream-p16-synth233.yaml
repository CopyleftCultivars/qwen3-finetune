schema_version: 1
stream_id: p16-synth233
run_name: p16-synth233
hypothesis: >-
  The rejected 155-item half-pool may have removed too much topical coverage;
  a deterministic 233-item pool may retain the full-pool coverage needed by
  v5clean while reducing low-value synthetic replay. Falsified if the
  candidate misses the primary gate or any guardrail.
lever_tier: tier2
prior: >-
  levers.md synth-item-count row: 155 raw QMD items produced delta +0.1844
  with clean guards, while v5clean uses all 311. This is an executable
  intermediate dose; it does not claim to author items beyond the current
  QMD ceiling.
predicted_direction: up
candidate_edit: >-
  Set synth_item_count=233 before the existing cyclic-shift expansion; retain
  the v5clean sources, split, optimizer, bare-letter surface, and all settled
  settings.
rationale: >-
  A midpoint dose distinguishes a useful coverage/intensity tradeoff from the
  half-pool rejection before investing in a new MCQ authoring pipeline.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p16-synth233.json
guardrails: results/autoresearch_guardrails_p16-synth233.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p16-synth233.json
finetune_config: autoresearch/configs/phase14-tier2/p16-synth233.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p16-synth233
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p16-synth233.json
    --output results/primary_p16-synth233.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p16-synth233
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p16-synth233.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p16-synth233
    --label p16-synth233
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p16-synth233.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p16-synth233.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p16-synth233.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p16-synth233.json
    --output results/autoresearch_guardrails_p16-synth233.json
