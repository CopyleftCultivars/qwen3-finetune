# Tournament 2 (#68) stream spec 1: family (c) jdata lever at 4 epochs.
stream_id: jdata4
run_name: p5real2-jdata
hypothesis: >-
  The J-space absent-category include lever, which reached +0.687 primary
  delta (92% of the 2-SE bar) at 2 epochs in batch phase5-real-1
  (autoresearch/journal.jsonl row 3), clears the frozen gate at 4 epochs, and
  the A-bias drift that rejected it (0.361 deviation vs 0.100 limit) shrinks
  below the bias-guard limit as training consolidates. Falsified if the delta
  stays under 0.7498 or the bias deviation stays over 0.100.
