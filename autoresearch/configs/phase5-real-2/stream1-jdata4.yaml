  phase5-real-1 journal outcome (near-miss + undertraining-bias hypothesis)
  plus the levers.md J-space-informed data selection row and frozen
  jspace_config.json absent -> add_category_data mapping. Guardrail risk:
  bias guard again — that is the explicit test; compute guard projected safe
  (~17-18 min vs 20 limit from the 10.8-min 2-epoch stream).
predicted_direction: up
candidate_edit: >-
  Same jdata lever as phase5-real-1 (--jspace-bucket absent --jspace-action
  include, 218/311 QMD records) with epochs 2 -> 4.
rationale: >-
  Stream family (c); primary lever = J-space data selection, distinct from
  stream 2's epochs-only control per program.md diversity rules; failed
  phase5-real-1 streams interpreted here, not silently repeated.
baseline_primary: results/primary_objective_v3_clean.json
