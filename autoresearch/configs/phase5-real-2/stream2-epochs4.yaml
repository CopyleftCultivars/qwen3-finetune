# Tournament 2 (#68) stream spec 2: family (b) conservative hyperparameter —
# epochs-only control at the same 4-epoch operating point as stream 1.
stream_id: epochs4
run_name: p5real2-epochs
hypothesis: >-
  Training the unmodified v3-clean data mix for 4 epochs (vs the champion's
  6) recovers most of the baseline primary and keeps the letter marginal
  within the bias limit, isolating how much of stream 1's effect is epochs
  rather than J-space data selection. Both phase5-real-1 candidates at 2
  epochs showed 0.36-0.39 A-bias deviation (journal row 3); if 4 epochs stays
  biased, undertraining alone does not explain the drift. Falsified as an
  acceptance candidate if the delta fails the 2-SE bar (expected — a 4-epoch
  subset of baseline training should not beat the 6-epoch champion).
lever_tier: tier1
prior: >-
  levers.md Epochs row (SEARCH DIMENSION, untested whether fewer epochs
  avoids overfitting) and the phase5-real-1 undertraining-bias hypothesis.
  Guardrail risk: bias guard, deliberately probed by this control.
predicted_direction: up
candidate_edit: >-
  v3-clean baseline mix and settings, epochs 6 -> 4; no other change.
rationale: >-
  Stream family (b); primary lever = epochs (Tier 1), distinct from stream
  1's data-selection lever per program.md diversity rules; batch includes a
  non-hyperparameter stream (stream 1).
baseline_primary: results/primary_objective_v3_clean.json
candidate_primary: results/primary_p5real2-epochs.json
guardrails: results/autoresearch_guardrails_p5real2-epochs.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p5real2-epochs.json
finetune_config: autoresearch/configs/phase5-real-2/p5r2-epochs4.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p5real2-epochs
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p5real2-epochs.json
    --output results/primary_p5real2-epochs.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p5real2-epochs.json
    --output results/autoresearch_guardrails_p5real2-epochs.json
