schema_version: 1

# Phase 20: one isolated proposed-answer verification target.
# It preserves the strict v5clean base and adds only the audited verification
# source. No Spanish, reflection, rationale-replay, CROP, or general-replay
# stream is combined here.
run_name: p20-proposed-answer-audit
dataset_suffix: _p20verify
output_root: outputs
dataset_output_dir: data
seed: 42
training_seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations:
qmd_mcq:
prepared_train_data: data/verification_levers/proposed_answer_audit/train.jsonl
prepared_val_data: data/verification_levers/proposed_answer_audit/validation.jsonl
verification_task: proposed_answer_audit
verification_manifest: data/verification_target/proposed_answer_audit/manifest.json
verification_base_train: data/train_p6lrr2_strict_clean.jsonl
verification_base_validation: data/val_p6lrr2_strict_clean.jsonl
verification_source_train: data/verification_target/proposed_answer_audit/train.jsonl
verification_source_validation: data/verification_target/proposed_answer_audit/validation.jsonl

lr: 0.00005
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 4
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.025
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false
conversation_ratio:
target_permutation_ids:
sft_format: bare-letter
synth_item_count:
chat_template_variant: hardcoded-v1
train_order: shuffled

model: unsloth/Qwen3-0.6B
merge_base: Qwen/Qwen3-0.6B
merge_dtype: float16
force_peft: false
wandb: false
resume: false
