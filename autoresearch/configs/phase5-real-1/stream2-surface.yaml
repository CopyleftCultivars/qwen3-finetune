# Phase 5 real tournament (#64) stream spec 2: family (d) J-space-guided
# answer-surface. Real training, real scoring, real bias/compute/sealed
# guards; periodic guards carried forward per chainlink #66.
stream_id: surf-prefix
run_name: p5real-surface
hypothesis: >-
  Training with an answer-prefix SFT target format surfaces mid-layer
  knowledge the final head overrides: present_unsurfaced is the largest
  J-space bucket (45/113 dev rows, 39.8%) and dominates natural_fertilizers
  (7/10 items at 0.10 accuracy) per results/jspace_category_summary.json.
  Falsified if the primary delta fails the frozen 2-SE gate (threshold 0.7498).
lever_tier: tier2
prior: >-
  Frozen jspace_config.json present_unsurfaced -> adjust_answer_surface
  mapping plus the levers.md SFT target format row. Guardrail risk: bias
  guard via format-induced letter-prior shifts; the letter marginal is
  measured for real by build_guardrails.py from the candidate MCQ result.
predicted_direction: up
candidate_edit: >-
  finetune.py config sft_format answer-prefix (bare-letter -> answer-prefix
  SFT targets); epochs 2 shared budget constraint.
rationale: >-
  Stream family (d); primary lever = SFT answer-surface format (Tier 2),
  distinct from stream 1's data-selection lever per program.md diversity
  rules. The recommended position/order stream was substituted because
  --target-permutation-ids consumes training ids while J-space signals carry
  dev-row ids with zero overlap (documented levers.md caveat).
baseline_primary: results/primary_objective_v3_clean.json
candidate_primary: results/primary_p5real-surface.json
guardrails: results/autoresearch_guardrails_p5real-surface.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p5real-surface.json
finetune_config: autoresearch/configs/phase5-real-1/p5r1-surface.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p5real-surface
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p5real-surface.json
    --output results/primary_p5real-surface.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p5real-surface.json
    --output results/autoresearch_guardrails_p5real-surface.json
