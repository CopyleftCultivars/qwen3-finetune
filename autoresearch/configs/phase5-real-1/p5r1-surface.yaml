schema_version: 1

# Phase 5 real tournament (#64), stream 2 finetune config.
# v3-clean baseline settings with ONE lever changed: SFT target format
# bare-letter -> answer-prefix. epochs 6 -> 2 is the shared budget constraint
# (see stream 1 note), not a lever.
run_name: p5real-surface
dataset_suffix: _p5r1b
output_root: outputs
dataset_output_dir: data
seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations: data/sources/gemma4/hf_dataset/train.jsonl
mcq_rationale:
qmd_mcq: data/sources/qmd_mcq_all_phase3.jsonl

sft_format: answer-prefix

lr: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 2
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false
