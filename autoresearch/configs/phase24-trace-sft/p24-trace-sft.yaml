schema_version: 1

# Chainlink #114 (I9), Epic #105, M2: Plan B SFT. Trains on prepare_dataset_v6.py's
# output (data/train_v6.jsonl) -- the v3 mix with causally-verified teacher
# reasoning traces spliced into the <think> block of MCQ rows that have one
# (autoresearch/configs/phase24-trace-sft/*_pipeline.md has the full recipe).
# All hyperparameters below are v5clean's SETTLED CONSTANT values (levers.md
# Tier 1) unchanged -- the only lever this phase moves is the dataset itself,
# exactly like every other single-lever phase in this program.
run_name: p24-trace-sft
dataset_suffix: _p24tracesft
output_root: outputs
dataset_output_dir: data
seed: 42
training_seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations:
qmd_mcq:
prepared_train_data: data/train_v6.jsonl
prepared_val_data: data/val_v6.jsonl
grounded_task: none

# Exact v5clean training settings (levers.md Tier 1, all SETTLED CONSTANT).
lr: 0.00005
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 4
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.025
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false
conversation_ratio:
target_permutation_ids:
sft_format: bare-letter
synth_item_count:
chat_template_variant: hardcoded-v1
train_order: shuffled

model: unsloth/Qwen3-0.6B
merge_base: Qwen/Qwen3-0.6B
merge_dtype: float16
force_peft: false
wandb: false
resume: false
