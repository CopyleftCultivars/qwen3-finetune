# Tier-1 sweep (#91) stream: v5clean packing=false -> true.
stream_id: packing
run_name: p7-packing
hypothesis: >-
  Packing has been wired but never correctness-tested on this short-pair
  dataset. Concatenating short examples into max-length training sequences
  may improve throughput and change the learning signal through more efficient
  token utilization, but can also hurt example-boundary learning. Direction is
  genuinely unknown. Falsified if the packing path fails, primary delta drops
  under v5clean's own bar, or any guard regresses versus v5clean's measured
  numbers (bias 0.060, forgetting 41.67%, rubric 60.8% baseline).
lever_tier: tier1
prior: >-
  levers.md Packing row: packing was absent in v3-clean and newly wired to
  TRL SFTConfig/dataset construction; it is untested. Chainlink #91
  priority-6 pick after epochs, rank, schedule, warmup, and alpha.
predicted_direction: unknown
candidate_edit: >-
  finetune.py config packing false -> true; lr=5e-5, cosine schedule,
  warmup_ratio=0.05, epochs=4, lora_r=32/alpha=64, lora_dropout=0.025,
  and all other v5clean settings unchanged.
rationale: >-
  Chainlink #91, lever 6 of the planned Tier-1 sweep. Single correctness/
  performance stream against the current champion (v5clean); if it passes,
  it is the first packing candidate eligible for promotion discussion.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p7-packing.json
guardrails: results/autoresearch_guardrails_p7-packing.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p7-packing.json
finetune_config: autoresearch/configs/phase7-tier1-sweep/p7-packing.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p7-packing
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p7-packing.json
    --output results/primary_p7-packing.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p7-packing
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p7-packing.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p7-packing
    --label p7-packing
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p7-packing.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p7-packing.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p7-packing.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p7-packing.json
    --output results/autoresearch_guardrails_p7-packing.json
