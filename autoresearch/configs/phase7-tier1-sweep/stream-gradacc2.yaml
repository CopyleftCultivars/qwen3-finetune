schema_version: 1

# Tier-1 sweep (#91) stream: v5clean grad_accum=4 -> 2.
stream_id: gradacc2
run_name: p7-gradacc2
hypothesis: >-
  Halving gradient accumulation from 4 to 2 increases optimizer-update
  frequency and reduces the effective batch from 16 to 8. This may improve
  adaptation on the small dataset, but the noisier updates can hurt stability
  or forgetting. Falsified if the candidate fails the primary gate or any
  quality, forgetting, bias, anchor, or compute guardrail versus v5clean.
lever_tier: tier1
prior: >-
  levers.md Gradient accumulation row: v3-clean used grad-accum=4 with
  per-device batch=4, and the setting is untested. Chainlink #91 priority-10
  pick after epochs, rank, schedule, warmup, alpha, packing, sequence length,
  target modules, and early-stop patience.
predicted_direction: unknown
candidate_edit: >-
  finetune.py config grad_accum 4 -> 2; lr=5e-5, cosine schedule,
  warmup_ratio=0.05, epochs=4, batch_size=4, lora_r=32/alpha=64,
  max_seq_len=2048, packing=false, and all other v5clean settings unchanged.
rationale: >-
  Chainlink #91, lever 10 of the planned Tier-1 sweep. Single lower-
  accumulation stream against the current champion; if it passes, it becomes
  a candidate for repeat confirmation before promotion discussion.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p7-gradacc2.json
guardrails: results/autoresearch_guardrails_p7-gradacc2.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p7-gradacc2.json
finetune_config: autoresearch/configs/phase7-tier1-sweep/p7-gradacc2.yaml
finetune_dry_run: false
eval_commands:
