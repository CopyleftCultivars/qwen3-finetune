schema_version: 1

# Tier-1 sweep (#91) stream: early-stop patience disabled -> 1 epoch.
stream_id: earlystop1
run_name: p7-earlystop1
hypothesis: >-
  Eval-loss early stopping with patience=1 may select the best epoch rather
  than always taking epoch 4, reducing overfit or wasted compute. The extra
  validation loop changes the training path and may also stop too early on
  noisy loss. Falsified if the candidate fails the primary gate or any
  quality, forgetting, bias, anchor, or compute guardrail versus v5clean.
lever_tier: tier1
prior: >-
  levers.md Early-stop patience row: training previously had no eval loop;
  early stopping is now implemented and untested at the v5clean base.
  Chainlink #91 priority-9 pick after epochs, rank, schedule, warmup, alpha,
  packing, sequence length, and target modules.
predicted_direction: unknown
candidate_edit: >-
  finetune.py config early_stop_patience disabled -> 1; lr=5e-5, cosine
  schedule, warmup_ratio=0.05, max_epochs=4, lora_r=32/alpha=64,
  max_seq_len=2048, packing=false, and all other v5clean settings unchanged.
rationale: >-
  Chainlink #91, lever 9 of the planned Tier-1 sweep. Single early-stop
  stream against the current champion; if it passes, it becomes a candidate
  for repeat confirmation before promotion discussion.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p7-earlystop1.json
guardrails: results/autoresearch_guardrails_p7-earlystop1.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p7-earlystop1.json
finetune_config: autoresearch/configs/phase7-tier1-sweep/p7-earlystop1.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p7-earlystop1
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p7-earlystop1.json
    --output results/primary_p7-earlystop1.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p7-earlystop1
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p7-earlystop1.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p7-earlystop1
    --label p7-earlystop1
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p7-earlystop1.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p7-earlystop1.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p7-earlystop1.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p7-earlystop1.json
    --output results/autoresearch_guardrails_p7-earlystop1.json
