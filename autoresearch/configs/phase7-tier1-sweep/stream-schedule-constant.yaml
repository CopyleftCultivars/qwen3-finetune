# Tier-1 sweep (#91) stream: LR schedule cosine -> constant, everything else =
# v5clean's settled base (lr=5e-5, lora_dropout=0.025, epochs=4,
# lora_r=32/alpha=64). warmup_ratio held at 0.05.
stream_id: schedule-constant
run_name: p7-schedule-constant
hypothesis: >-
  LR schedule was never tested at any value other than cosine (v3-clean's
  original default). Constant LR (after warmup) never decays, which may
  cause late-training instability or may simply be equivalent given the
  short 4-epoch run; direction genuinely unknown on this small
  (~4400-pair) dataset. Falsified if primary delta drops under v5clean's
  own bar, or if any guard regresses versus v5clean's measured numbers
  (bias 0.060, forgetting 41.67%, rubric 60.8% baseline).
lever_tier: tier1
prior: >-
  levers.md LR schedule row: untested vs linear/constant, no diagnostic
  evidence yet. Chainlink #91 priority-3 pick, per the planned order
  (epochs -> LoRA rank -> LR schedule -> ...).
predicted_direction: unknown
candidate_edit: >-
  finetune.py config lr_scheduler cosine -> constant; lr=5e-5,
  lora_dropout=0.025, epochs=4, lora_r=32/alpha=64, warmup_ratio=0.05
  unchanged (v5clean's settled base).
rationale: >-
  Chainlink #91, lever 3 of the planned Tier-1 sweep. Single-lever stream
  against the current champion (v5clean), paired with schedule-linear to
  bracket the current cosine pin.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p7-schedule-constant.json
guardrails: results/autoresearch_guardrails_p7-schedule-constant.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p7-schedule-constant.json
finetune_config: autoresearch/configs/phase7-tier1-sweep/p7-schedule-constant.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p7-schedule-constant
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p7-schedule-constant.json
    --output results/primary_p7-schedule-constant.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p7-schedule-constant
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p7-schedule-constant.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p7-schedule-constant
    --label p7-schedule-constant
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p7-schedule-constant.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p7-schedule-constant.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p7-schedule-constant.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p7-schedule-constant.json
    --output results/autoresearch_guardrails_p7-schedule-constant.json
