# Tier-1 sweep (#91) stream: v5clean's warmup_ratio=0.05 -> 0.00,
# everything else held at the settled champion configuration.
stream_id: warmup0
run_name: p7-warmup0
hypothesis: >-
  Warmup ratio has never been tested independently of LR schedule type;
  removing the 5% warmup exposes the full peak LR immediately and could
  improve effective optimization in this short four-epoch run, or could
  destabilize early updates. Direction is genuinely unknown on this small
  (~4400-pair) dataset. Falsified if primary delta drops under v5clean's own
  bar, or if any guard regresses versus v5clean's measured numbers (bias
  0.060, forgetting 41.67%, rubric 60.8% baseline).
lever_tier: tier1
prior: >-
  levers.md Warmup ratio row: v3-clean used warmup_ratio=0.05, but the knob
  was untested independently from scheduler type. Chainlink #91 priority-4
  pick, after epochs, LoRA rank, and LR schedule.
predicted_direction: unknown
candidate_edit: >-
  finetune.py config warmup_ratio 0.05 -> 0.00; lr=5e-5, cosine schedule,
  lora_dropout=0.025, epochs=4, lora_r=32/alpha=64, and all other v5clean
  settings unchanged.
rationale: >-
  Chainlink #91, lever 4 of the planned Tier-1 sweep. Single-lever stream
  against the current champion (v5clean), paired with warmup10 to bracket
  the champion's 0.05 setting.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p7-warmup0.json
guardrails: results/autoresearch_guardrails_p7-warmup0.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p7-warmup0.json
finetune_config: autoresearch/configs/phase7-tier1-sweep/p7-warmup0.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p7-warmup0
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p7-warmup0.json
    --output results/primary_p7-warmup0.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p7-warmup0
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p7-warmup0.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p7-warmup0
    --label p7-warmup0
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p7-warmup0.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p7-warmup0.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p7-warmup0.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p7-warmup0.json
    --output results/autoresearch_guardrails_p7-warmup0.json
