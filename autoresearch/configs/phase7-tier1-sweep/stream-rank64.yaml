# Tier-1 sweep (#91) stream: LoRA rank r 32 -> 64, everything else = v5clean's
# settled base (lr=5e-5, lora_dropout=0.025, epochs=4). alpha co-scaled
# 64 -> 128 to hold the effective LoRA scale (alpha/r=2) constant, isolating
# pure capacity/rank effect -- scale is tested as its own separate lever.
stream_id: rank64
run_name: p7-rank64
hypothesis: >-
  LoRA rank r was never tested at any value other than 32. Higher rank
  (more capacity), at CONSTANT effective scale (alpha co-scaled to keep
  alpha/r=2), may capture more of the task, or may overfit further on this
  small (~4400-pair) dataset -- direction genuinely unknown. Falsified if
  primary delta drops under v5clean's own bar, or if any guard regresses
  versus v5clean's measured numbers (bias 0.060, forgetting 41.67%, rubric
  60.8% baseline).
lever_tier: tier1
prior: >-
  levers.md LoRA rank r row: untested at any value besides 32. Chainlink
  #91 priority-2 pick, bracketing r=32 with r=16 and r=64, alpha co-scaled
  to isolate capacity from scale (scale tested separately as its own
  lever).
predicted_direction: unknown
candidate_edit: >-
  finetune.py config lora_r 32 -> 64, lora_alpha 64 -> 128 (co-scaled to
  hold alpha/r=2 constant); lr=5e-5, lora_dropout=0.025, epochs=4
  unchanged (v5clean's settled base).
rationale: >-
  Chainlink #91, lever 2 of the planned Tier-1 sweep. Single-lever stream
  against the current champion (v5clean), paired with rank16 to bracket
  r=32 -- a labelled micro-sweep of one lever, per program.md's diversity
  rule.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p7-rank64.json
guardrails: results/autoresearch_guardrails_p7-rank64.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p7-rank64.json
finetune_config: autoresearch/configs/phase7-tier1-sweep/p7-rank64.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p7-rank64
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p7-rank64.json
    --output results/primary_p7-rank64.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p7-rank64
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p7-rank64.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p7-rank64
    --label p7-rank64
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p7-rank64.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p7-rank64.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p7-rank64.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p7-rank64.json
    --output results/autoresearch_guardrails_p7-rank64.json
