schema_version: 1

# Tier-1 sweep (#91), lever 2: LoRA rank r. v5clean's exact settings
# (lr=5e-5, lora_dropout=0.025, epochs=4) except lora_r 32 -> 16, with
# lora_alpha co-scaled 64 -> 32 to hold the effective LoRA scale
# (alpha/r = 2, matching v5clean's ratio) constant. This isolates the
# pure capacity/rank effect from the scale effect, which is tested
# separately and independently as its own lever (fixed rank=32, alpha
# varied) later in the sweep.
run_name: p7-rank16
dataset_suffix: _p7r16
output_root: outputs
dataset_output_dir: data
seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations: data/sources/gemma4/hf_dataset/train.jsonl
mcq_rationale:
qmd_mcq: data/sources/qmd_mcq_all_phase3.jsonl

lr: 0.00005
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 4
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 16
lora_alpha: 32
lora_dropout: 0.025
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false
