schema_version: 1

# Tier-1 sweep (#91) stream: v5clean full 7-module LoRA -> attention-only.
stream_id: target-attn
run_name: p7-target-attn
hypothesis: >-
  Attention projections may carry most of the useful instruction and answer
  routing signal for this small dataset, while removing MLP adapters reduces
  interference and parameter updates. The narrower set may also reduce
  compute, but it could lose the feed-forward capacity needed for knowledge
  transfer. Falsified if the candidate fails the primary gate or any quality,
  forgetting, bias, anchor, or compute guardrail versus v5clean.
lever_tier: tier1
prior: >-
  levers.md LoRA target modules row: v3-clean uses all seven attention and
  MLP projections; narrower sets such as attention-only are untested.
  Chainlink #91 priority-8 pick after epochs, rank, schedule, warmup, alpha,
  packing, and sequence length.
predicted_direction: unknown
candidate_edit: >-
  finetune.py config target_modules full 7-module list -> q_proj,k_proj,v_proj,
  o_proj only; lr=5e-5, cosine schedule, warmup_ratio=0.05, epochs=4,
  lora_r=32/alpha=64, max_seq_len=2048, packing=false, and all other v5clean
  settings unchanged.
rationale: >-
  Chainlink #91, lever 8 of the planned Tier-1 sweep. Single attention-only
  stream against the current champion; if it passes, it becomes a candidate
  for repeat confirmation before promotion discussion.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p7-target-attn.json
guardrails: results/autoresearch_guardrails_p7-target-attn.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p7-target-attn.json
finetune_config: autoresearch/configs/phase7-tier1-sweep/p7-target-attn.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p7-target-attn
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p7-target-attn.json
    --output results/primary_p7-target-attn.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p7-target-attn
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p7-target-attn.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p7-target-attn
    --label p7-target-attn
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p7-target-attn.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p7-target-attn.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p7-target-attn.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p7-target-attn.json
    --output results/autoresearch_guardrails_p7-target-attn.json
