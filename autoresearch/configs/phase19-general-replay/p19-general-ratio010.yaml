schema_version: 1

run_name: p19-general-ratio010
dataset_suffix: _p19general010
output_root: outputs
dataset_output_dir: data
seed: 42
training_seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations:
qmd_mcq:
prepared_train_data: data/general_replay/ratio_010/train.jsonl
prepared_val_data: data/general_replay/ratio_010/validation.jsonl
general_replay_ratio: 0.10
general_replay_manifest: data/sources/general_instruction/dolly15k/audited/manifest.json
general_replay_base_train: data/train_p6lrr2_strict_clean.jsonl
general_replay_base_validation: data/val_p6lrr2_strict_clean.jsonl
general_replay_source_train: data/sources/general_instruction/dolly15k/audited/train.jsonl
general_replay_source_validation: data/sources/general_instruction/dolly15k/audited/validation.jsonl
general_replay_tokenizer: unsloth/Qwen3-0.6B

lr: 0.00005
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 4
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.025
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false
conversation_ratio:
target_permutation_ids:
sft_format: bare-letter
synth_item_count:
chat_template_variant: hardcoded-v1
train_order: shuffled

model: unsloth/Qwen3-0.6B
merge_base: Qwen/Qwen3-0.6B
merge_dtype: float16
force_peft: false
wandb: false
resume: false
