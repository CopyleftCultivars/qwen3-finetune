schema_version: 1

# Phase 21: one isolated MCQ-authoring lever.
# The strict English v5clean base is composed with judge-kept MCQs whose
# incorrect options were repaired for plausibility and misconception coverage.
# No Spanish, auxiliary, reflection, verification, or general-replay stream is
# included in this run.
run_name: p21-distractor-quality
dataset_suffix: _p21distractor
output_root: outputs
dataset_output_dir: data
seed: 42
training_seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations:
qmd_mcq:
prepared_train_data: data/distractor_quality_levers/train.jsonl
prepared_val_data: data/distractor_quality_levers/validation.jsonl
distractor_quality_task: mcq_distractor_quality
distractor_quality_manifest: data/sources/qmd_mcq_distractor_quality_manifest.json
distractor_quality_base_train: data/train_p6lrr2_strict_clean.jsonl
distractor_quality_base_validation: data/val_p6lrr2_strict_clean.jsonl
distractor_quality_source_train: data/sources/qmd_mcq_distractor_quality_train.jsonl
distractor_quality_source_validation: data/sources/qmd_mcq_distractor_quality_validation.jsonl

lr: 0.00005
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 4
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.025
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false
conversation_ratio:
target_permutation_ids:
sft_format: bare-letter
synth_item_count:
chat_template_variant: hardcoded-v1
train_order: shuffled

model: unsloth/Qwen3-0.6B
merge_base: Qwen/Qwen3-0.6B
merge_dtype: float16
force_peft: false
wandb: false
resume: false
