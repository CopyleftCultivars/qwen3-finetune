# Tournament 3 (#69) stream spec 1: family (b) efficiency lever batch_size 8,
# pinned at epochs 5 (midpoint of the journal-mapped bias and delta curves).
stream_id: batch8-5ep
run_name: p5real3-batch8
hypothesis: >-
  batch_size 8 (effective 32) fits 5-epoch full-mix training inside the
  20-min budget (~17 min projected from 4.1 min/epoch at batch 4 with ~1.75x
  throughput), and at 5 epochs the bias deviation crosses under the 0.100
  limit (dose-response 0.387@2ep -> 0.175@4ep, journal rows 3-4) while the
  primary delta retains enough of the +0.904@4ep gain to clear the 0.7498
  bar (curve endpoint 0@6ep). Falsified if compute exceeds 20 min, bias
