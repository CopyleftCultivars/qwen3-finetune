schema_version: 1

# Reproduces v3-clean's actual known settings:
# - adapter output: outputs/lora-adapter-v3-clean
# - training data: data/train_v3.jsonl / data/val_v3.jsonl
# - lr peak observed in trainer_state.json: ~1.9999e-4
# - LoRA config: r=32, alpha=64, dropout=0, all 7 target modules
run_name: v3-clean
dataset_suffix: _v3
output_root: outputs
dataset_output_dir: data
seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations: data/sources/gemma4/hf_dataset/train.jsonl
mcq_rationale:
qmd_mcq: data/sources/qmd_mcq_all_phase3.jsonl

lr: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 6
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false

conversation_ratio:
target_permutation_ids:
sft_format: bare-letter
synth_item_count:

model: unsloth/Qwen3-0.6B
merge_base: Qwen/Qwen3-0.6B
merge_dtype: float16
force_peft: false
wandb: false
resume: false
