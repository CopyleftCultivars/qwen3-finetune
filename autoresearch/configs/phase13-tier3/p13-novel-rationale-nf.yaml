schema_version: 1

# Tier 3 P13: genuinely new, locally authored step-back targets for the
# weakest visible v5clean J-space priority category.  This is intentionally
# opt-in and keeps the v5clean/p12 recipe fixed apart from target construction.
run_name: p13-novel-rationale-nf
dataset_suffix: _p13novel_nf
output_root: outputs
dataset_output_dir: data
seed: 42
training_seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations: data/sources/gemma4/hf_dataset/train.jsonl
mcq_rationale: data/sources/p13_novel_rationale_nf.jsonl
mcq_rationale_categories: natural_fertilizers
rationale_overlay: true
qmd_mcq: data/sources/qmd_mcq_all_phase3.jsonl
filter_system_prompts: false
adversarial_refusals:
adversarial_refusal_count:
cloze_source:
cloze_conversations:
cloze_benchmark:
cloze_maximum_answer_frequency: 50
cloze_count:

lr: 0.00005
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 4
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.025
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false

conversation_ratio:
target_permutation_ids:
sft_format: bare-letter
synth_item_count:
curriculum_order: none
curriculum_report:
chat_template_variant: hardcoded-v1
train_order: shuffled

jspace_signals: results/jspace_item_signals.jsonl
jspace_bucket: late_weak
jspace_category: natural_fertilizers
jspace_max_items:
jspace_action: rationale_overlay

model: unsloth/Qwen3-0.6B
merge_base: Qwen/Qwen3-0.6B
merge_dtype: float16
force_peft: false
wandb: false
resume: false
