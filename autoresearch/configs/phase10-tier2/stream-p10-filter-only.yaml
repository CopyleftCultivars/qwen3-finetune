schema_version: 1
stream_id: p10-filter-only
run_name: p10-filter-only
hypothesis: >-
  Removing the known embedded persona/system prefixes and persona-only rows
  without changing the data mix will improve transfer by removing accidental
  instruction leakage. Falsified if the candidate fails the frozen primary or
  any quality, forgetting, bias, anchor, compute, or sealed-test guard.
lever_tier: tier2
prior: >-
  The filter is structurally validated, but its previous GPU result was
  confounded with 400 cloze rows and ten refusals. This run changes only the
  filter flag against v5clean.
predicted_direction: unknown
candidate_edit: >-
  prepare_dataset_v3.py --filter-system-prompts; all v5clean sources,
  optimizer, split, and training interface remain fixed.
rationale: >-
  This is the causal filter-only test requested after the combined hygiene
  probe; no refusal or cloze records are included.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p10-filter-only.json
guardrails: results/autoresearch_guardrails_p10-filter-only.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p10-filter-only.json
finetune_config: autoresearch/configs/phase10-tier2/p10-filter-only.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p10-filter-only
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_p10filter.jsonl
    --mcq-output results/mcq_gold_ll_p10-filter-only.json
    --output results/primary_p10-filter-only.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p10-filter-only
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p10-filter-only.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p10-filter-only
    --label p10-filter-only
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p10-filter-only.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p10-filter-only.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p10-filter-only.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p10-filter-only.json
    --output results/autoresearch_guardrails_p10-filter-only.json
