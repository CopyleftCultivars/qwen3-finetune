schema_version: 1

# Tier-2 synthetic-item-count variant against the v5clean champion.
stream_id: synth155
run_name: p7-synth155
hypothesis: >-
  Deterministically retaining half of the 311 raw QMD MCQ records before the
  existing cyclic-shift expansion may remove low-value or noisy synthetic
  items, reduce overfitting, and improve the primary objective. It may also
  discard useful coverage. Falsified if the candidate fails the primary gate
  or any quality, forgetting, bias, anchor, or compute guardrail.
lever_tier: tier2
prior: >-
  levers.md identifies synth-item count as an explicit Tier-2 search dimension:
  v3-clean uses all 311 available raw QMD items, while the live harness can
  deterministically cap the pool without authoring new questions. The current
  champion is sensitive to excess training intensity across several Tier-1
  axes, so a half-pool is the smallest useful down-dose.
predicted_direction: up
candidate_edit: >-
  prepare_dataset_v3.py synth_item_count disabled -> 155; all v5clean settings
  otherwise unchanged, including bare-letter targets and exact MCQ balance.
rationale: >-
  Final currently executable data-mixture branch before stopping Tier-2. If it
  passes, it becomes a candidate for repeat confirmation before promotion.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p7-synth155.json
guardrails: results/autoresearch_guardrails_p7-synth155.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p7-synth155.json
finetune_config: autoresearch/configs/phase7-tier2/p7-synth155.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p7-synth155
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p7-synth155.json
    --output results/primary_p7-synth155.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p7-synth155
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p7-synth155.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p7-synth155
    --label p7-synth155
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p7-synth155.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p7-synth155.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p7-synth155.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p7-synth155.json
    --output results/autoresearch_guardrails_p7-synth155.json
