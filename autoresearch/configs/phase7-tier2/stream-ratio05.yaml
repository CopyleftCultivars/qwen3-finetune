schema_version: 1

# Tier-2 replay-ratio variant against the v5clean champion.
stream_id: ratio05
run_name: p7-ratio05
hypothesis: >-
  A 50% conversation fraction gives the QMD MCQ objective equal pool weight
  with conversational replay, while preserving exact MCQ letter balance. The
  smaller deterministic dataset may focus learning on the MCQ objective and
  reduce compute, but it can also discard useful general-language replay.
  Falsified if the candidate fails the primary gate or any quality, forgetting,
  bias, anchor, or compute guardrail.
lever_tier: tier2
prior: >-
  levers.md general replay ratio row: the knob is implemented as
  subsample-only, non-monotone, and verified at ratios 0.5 and 0.97. This
  current-champion test starts at 0.5, where conversation and MCQ pools are
  balanced by count after deterministic subsampling.
predicted_direction: unknown
candidate_edit: >-
  prepare_dataset_v3.py conversation_ratio disabled -> 0.5; lr=5e-5, cosine
  schedule, warmup_ratio=0.05, epochs=4, batch_size=4, grad_accum=4,
  lora_r=32/alpha=64, sft_format=bare-letter, max_seq_len=2048,
  packing=false, and all other v5clean settings unchanged.
rationale: >-
  Third Tier-2 continuation after the complete #91 Tier-1 sweep. Single
  replay-ratio stream against the current champion; if it passes, it becomes
  a candidate for repeat confirmation before promotion discussion.
baseline_primary: results/primary_objective_v5_clean.json
candidate_primary: results/primary_p7-ratio05.json
guardrails: results/autoresearch_guardrails_p7-ratio05.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p7-ratio05.json
finetune_config: autoresearch/configs/phase7-tier2/p7-ratio05.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p7-ratio05
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p7-ratio05.json
    --output results/primary_p7-ratio05.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p7-ratio05
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p7-ratio05.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-p6-lr5e5-r2
    --candidate-model outputs/merged-model-p7-ratio05
    --label p7-ratio05
    --baseline-label codexv5
    --reuse-baseline
    --judge-backend codex
    --items-per-type 15
    --output results/periodic_guards_p7-ratio05.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p7-ratio05.json
    --baseline-mcq results/mcq_gold_ll_v5_clean.json
    --candidate-general-mcq results/general_knowledge_p7-ratio05.json
    --baseline-general-mcq results/general_knowledge_v5_clean.json
    --periodic-guards results/periodic_guards_p7-ratio05.json
    --output results/autoresearch_guardrails_p7-ratio05.json
