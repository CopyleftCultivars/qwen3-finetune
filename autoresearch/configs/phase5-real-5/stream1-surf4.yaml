# Tournament 5 (#75) stream spec 1: epochs-4 + answer-prefix SFT format.
# Full periodic guards (rubric + grader_anchor) measured BEFORE the gate
# decision, not as a follow-up campaign -- the process fix #75 exists for.
# Baseline free-form generation/grading reused from #66's campaign
# (--baseline-label p5accept-ep4 --reuse-baseline), since it's the same
# v3-clean champion -- no need to re-pay for it.
stream_id: surf4
run_name: p5real5-surf4
hypothesis: >-
  epochs-4 + answer-prefix SFT format keeps most of plain epochs-4's primary
  gain (journal rows 4-8: mean +0.711 over 5 runs) while reducing the rubric
  drop (6.43pp, over the 5.0pp limit, chainlink #66) below the guard, because
  a more explicit answer surface may reduce the free-form quality regression
  epochs-4 alone caused. Falsified if rubric drop still exceeds 5.0pp or the
  primary delta fails the 0.40 bar.
lever_tier: tier2
prior: >-
  levers.md SFT target format row (untested alternative to bare-letter) plus
  the #66 finding that plain epochs-4 passes primary but fails rubric. This
  is a NEW combination: format was previously tested alone at 2 epochs
  (phase5-real-1, delta -0.082) and epochs-4 was previously tested alone
  (this stream tests them together at the epoch count known to work).
predicted_direction: up
candidate_edit: >-
  finetune.py config sft_format answer-prefix + epochs 6 -> 4 (two changes
  combined deliberately, per #75's explicit suggestion to pair epochs-4 with
  a rationale/answer-surface tweak rather than repeat a known-fail config).
rationale: >-
  Chainlink #75 process-fix tournament: rubric+grader_anchor measured before
  the accept/reject decision, not after. Distinct primary lever combination
  from stream 2 (dropout) per program.md diversity rules.
baseline_primary: results/primary_objective_v3_clean.json
candidate_primary: results/primary_p5real5-surf4.json
guardrails: results/autoresearch_guardrails_p5real5-surf4.json
write_passing_guardrails: false
guardrails_inject_compute: true
gate_output: results/autoresearch_gate_p5real5-surf4.json
finetune_config: autoresearch/configs/phase5-real-5/p5r5-surf4.yaml
finetune_dry_run: false
eval_commands:
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_primary.py
    --model outputs/merged-model-p5real5-surf4
    --weights autoresearch/objective_weights.json
    --mcq-dataset data/val_v3.jsonl
    --mcq-output results/mcq_gold_ll_p5real5-surf4.json
    --output results/primary_p5real5-surf4.json
    --diagnostics-dir ../benchmark-eval-workspace/diagnostics
  - >-
    conda run -n qwen3-diagnostics python autoresearch/score_mcq_ll.py
    --model outputs/merged-model-p5real5-surf4
    --dataset autoresearch/general_knowledge_probe.jsonl
    --output results/general_knowledge_p5real5-surf4.json
  - >-
    python3 autoresearch/measure_periodic_guards.py
    --baseline-model outputs/merged-model-v3-clean
    --candidate-model outputs/merged-model-p5real5-surf4
    --label p5real5-surf4
    --baseline-label p5accept-ep4
    --reuse-baseline
    --items-per-type 6
    --output results/periodic_guards_p5real5-surf4.json
  - >-
    conda run -n qwen3-diagnostics python autoresearch/build_guardrails.py
    --candidate-mcq results/mcq_gold_ll_p5real5-surf4.json
    --baseline-mcq results/mcq_gold_ll_v3_clean.json
    --candidate-general-mcq results/general_knowledge_p5real5-surf4.json
    --baseline-general-mcq results/general_knowledge_v3_clean.json
    --periodic-guards results/periodic_guards_p5real5-surf4.json
    --output results/autoresearch_guardrails_p5real5-surf4.json
