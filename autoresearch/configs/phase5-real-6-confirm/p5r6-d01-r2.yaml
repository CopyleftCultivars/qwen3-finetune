schema_version: 1

# Dropout sweep (#78), stream 1: lora_dropout 0.01 at the epochs-4 pin.
# Dose-response point between dropout 0 (primary +0.71, rubric FAIL) and
# 0.05 (primary +0.334, rubric PASS).
run_name: p5real6-d01-r2
dataset_suffix: _p5r6ar2
output_root: outputs
dataset_output_dir: data
seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations: data/sources/gemma4/hf_dataset/train.jsonl
mcq_rationale:
qmd_mcq: data/sources/qmd_mcq_all_phase3.jsonl

lr: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 4
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.01
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false
