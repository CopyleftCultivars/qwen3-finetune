schema_version: 1

# Tournament 4 (#71), stream 2: epochs-5 probe mapping the delta/bias curves
# between the validated 4-epoch (+0.904, bias 0.175) and 6-epoch (champion,
# delta 0, bias 0.272) endpoints. Borderline vs the 25-min budget by design.
run_name: p5real4-ep5
dataset_suffix: _p5r4b
output_root: outputs
dataset_output_dir: data
seed: 42
split: 0.9
min_output_chars: 10
max_total_chars: 8192

conversations: data/sources/gemma4/hf_dataset/train.jsonl
mcq_rationale:
qmd_mcq: data/sources/qmd_mcq_all_phase3.jsonl

lr: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.05
epochs: 5
early_stop_patience:
batch_size: 4
grad_accum: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
weight_decay: 0.01
max_seq_len: 2048
packing: false
